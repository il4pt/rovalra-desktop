<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>FPS sayacı</title>
<style>
    :root {
        color-scheme: dark;
        --bg: #111216;
        --panel: #1a1c22;
        --line: #2a2d35;
        --text: #e8e9ec;
        --muted: #9a9ea8;
        --accent: #335fff;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 system-ui, sans-serif;
        padding: 18px;
        user-select: none;
    }
    h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .hint { color: var(--muted); margin-bottom: 14px; }
    #screen {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background:
            linear-gradient(160deg, #2b3d5c 0%, #1c3a2a 60%, #2c4a1f 100%);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        touch-action: none;
    }
    #screen::after {
        content: 'Oyun ekranı';
        position: absolute;
        inset: auto 0 8px 0;
        text-align: center;
        color: rgba(255, 255, 255, 0.35);
        font-size: 11px;
        pointer-events: none;
    }
    #counter {
        position: absolute;
        padding: 3px 7px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font: 600 11px/1.3 ui-monospace, monospace;
        cursor: grab;
        white-space: pre;
        outline: 2px solid transparent;
        transition: outline-color 0.15s;
    }
    #counter:hover, #counter.dragging { outline-color: var(--accent); }
    #counter.dragging { cursor: grabbing; }
    #counter.hidden { opacity: 0.35; }
    .controls {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px 14px;
        align-items: center;
        margin-top: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
    }
    label { color: var(--muted); }
    input[type='range'] { width: 100%; accent-color: var(--accent); }
    input[type='checkbox'] { accent-color: var(--accent); width: 16px; height: 16px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
    button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    #status { color: var(--muted); font-size: 12px; }
    .warn { color: #f0b429; }
</style>
</head>
<body>
    <h1>FPS sayacı</h1>
    <p class="hint">Sayacı sürükleyip istediğiniz yere bırakın. Oyun açıksa anında yer değiştirir.</p>

    <div id="screen"><div id="counter">FPS 144
8.3 ms</div></div>

    <div class="controls">
        <label for="visible">Göster</label>
        <div class="row"><input type="checkbox" id="visible"><span id="visibleNote"></span></div>

        <label for="size">Boyut</label>
        <input type="range" id="size" min="10" max="40" step="1">

        <label for="detailed">Ayrıntılı</label>
        <div class="row"><input type="checkbox" id="detailed"><span style="color:var(--muted)">CPU / GPU yükü ve kare grafiği</span></div>
    </div>

    <div class="footer">
        <span id="status"></span>
        <button id="reset" type="button">Sıfırla</button>
    </div>

    <script src="overlay.js"></script>
</body>
</html>
